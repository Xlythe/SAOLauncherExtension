plugins {
    id 'com.android.application' version '9.5.3'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace 'com.xlythe.saolauncher.extension.heart'
    compileSdk 37
    defaultConfig {
        applicationId 'com.xlythe.saolauncher.extension.heart'
        minSdk 14
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }
    buildFeatures { buildConfig = true }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['src']
        res.srcDirs = ['res']
        assets.srcDirs = ['assets']
    }
}
